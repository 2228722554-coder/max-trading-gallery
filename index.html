<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAX 图证开单理由复盘图库｜公网手机版</title>
  <style>
    :root { color-scheme: light; --text:#172026; --muted:#65717b; --line:#d8e0e5; --panel:#fff; --bg:#f4f6f3; --accent:#2d7f72; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif; background:var(--bg); color:var(--text); line-height:1.55; }
    header { position:sticky; top:0; z-index:5; background:rgba(244,246,243,.97); border-bottom:1px solid var(--line); padding:14px 14px 12px; backdrop-filter:blur(8px); }
    h1 { font-size:20px; margin:0 0 8px; letter-spacing:0; }
    .stats, .note { color:var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
    .controls { display:grid; grid-template-columns:minmax(0,1fr) 132px; gap:8px; margin-top:10px; }
    .wide { grid-column:1 / -1; }
    input, select, button { width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); padding:9px 10px; font:inherit; font-size:14px; }
    button { cursor:pointer; background:#fdfefd; }
    button.primary { color:#fff; background:var(--accent); border-color:var(--accent); font-weight:600; }
    button:disabled { opacity:.58; cursor:wait; }
    main { max-width:980px; margin:0 auto; padding:14px 10px 36px; }
    .notice { color:var(--muted); font-size:13px; margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:1fr; gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:0 1px 2px rgba(20,28,34,.04); }
    .media { background:#e8edea; aspect-ratio:16 / 10; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
    .media img { width:100%; height:100%; object-fit:contain; display:block; }
    .body { padding:11px 12px 13px; }
    .meta { color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
    h2 { font-size:16px; margin:0 0 7px; letter-spacing:0; }
    p { margin:7px 0; overflow-wrap:anywhere; }
    .reason { font-weight:600; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
    .chips span { border:1px solid var(--line); background:#f7faf8; border-radius:999px; padding:3px 7px; font-size:12px; color:#2a4d48; }
    .logicbox { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:9px 0; margin:9px 0; }
    .logic-title { color:var(--accent); font-weight:700; margin-bottom:5px; }
    details { margin-top:8px; }
    summary { color:var(--accent); cursor:pointer; font-weight:600; }
    .loadbar { display:grid; grid-template-columns:1fr; gap:8px; margin-top:14px; }
    .empty { border:1px dashed var(--line); border-radius:8px; padding:18px; color:var(--muted); background:#fff; text-align:center; }
    @media (min-width: 760px) {
      header { padding:16px 20px 13px; }
      .controls { grid-template-columns:minmax(240px,1fr) 160px 160px 220px auto; }
      .wide { grid-column:auto; }
      .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .loadbar { grid-template-columns:1fr auto; align-items:center; }
    }
  </style>
</head>
<body>
  <header>
    <h1>MAX 图证开单理由复盘图库｜公网手机版</h1>
    <div class="stats" id="stats"><span>正在载入索引…</span></div>
    <div class="controls">
      <input id="q" class="wide" placeholder="搜索币种、理由、知识点、开单逻辑、上下文">
      <select id="role"><option value="">全部类型</option></select>
      <select id="direction"><option value="">全部方向</option></select>
      <select id="logic"><option value="">全部开单逻辑</option></select>
      <button id="loadAll">载入全部索引</button>
    </div>
  </header>
  <main>
    <p class="notice">说明：先显示最新图片，继续下拉或点“加载更多”再取后续数据；搜索或筛选时会自动载入全部文字索引，但图片仍按需加载。</p>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>没有匹配结果。</div>
    <div class="loadbar">
      <div class="note" id="status">准备中…</div>
      <button class="primary" id="more">加载更多</button>
    </div>
  </main>
  <script>
    const state = { manifest:null, rows:[], loaded:new Set(), visibleLimit:40, filtered:[], busy:false };
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const splitTags = value => String(value || '').replaceAll('|','、').split('、').map(x => x.trim()).filter(Boolean);
    function optionList(select, values) {
      for (const value of values) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      }
    }
    async function init() {
      state.manifest = await fetch('data/manifest.json', { cache:'no-store' }).then(r => r.json());
      $('stats').innerHTML = `<span>总图证：${state.manifest.total}</span><span>最新更新：${escapeHtml(state.manifest.updated)}</span><span>${escapeHtml(state.manifest.logicStat)}</span>`;
      optionList($('role'), state.manifest.roles);
      optionList($('direction'), state.manifest.directions);
      optionList($('logic'), state.manifest.logics);
      await loadChunk(0);
      applyFilters();
    }
    async function loadChunk(index) {
      if (!state.manifest || state.loaded.has(index) || state.busy) return;
      const chunk = state.manifest.chunks[index];
      if (!chunk) return;
      state.busy = true;
      updateStatus('载入中…');
      try {
        const rows = await fetch(chunk.file, { cache:'no-store' }).then(r => r.json());
        state.rows.push(...rows);
        state.loaded.add(index);
      } finally {
        state.busy = false;
      }
    }
    async function loadNext() {
      const next = state.loaded.size;
      if (state.manifest && next < state.manifest.chunks.length) {
        await loadChunk(next);
      } else {
        state.visibleLimit += 40;
      }
      applyFilters();
    }
    async function loadAll() {
      if (!state.manifest) return;
      $('loadAll').disabled = true;
      $('more').disabled = true;
      for (let i = 0; i < state.manifest.chunks.length; i++) {
        await loadChunk(i);
      }
      $('loadAll').disabled = false;
      $('more').disabled = false;
      applyFilters(true);
    }
    function needsFullIndex() {
      return $('q').value.trim() || $('role').value || $('direction').value || $('logic').value;
    }
    let filterTimer = null;
    function scheduleFilter() {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(async () => {
        state.visibleLimit = 40;
        if (needsFullIndex() && state.loaded.size < state.manifest.chunks.length) await loadAll();
        applyFilters();
      }, 180);
    }
    function applyFilters() {
      const query = $('q').value.trim().toLowerCase();
      const role = $('role').value;
      const direction = $('direction').value;
      const logic = $('logic').value;
      state.filtered = state.rows.filter(row => {
        const okText = !query || String(row.search || '').toLowerCase().includes(query);
        return okText && (!role || row.role === role) && (!direction || row.direction === direction) && (!logic || row.logic === logic);
      });
      render();
    }
    function chips(value) {
      return splitTags(value).map(tag => `<span>${escapeHtml(tag)}</span>`).join('');
    }
    function card(row) {
      return `<article class="card">
        <div class="media"><img loading="lazy" decoding="async" src="${escapeHtml(row.image)}" alt="${escapeHtml(row.name)}"></div>
        <div class="body">
          <div class="meta"><span>#${escapeHtml(row.n)}</span><span>消息 ${escapeHtml(row.id)}</span><span>${escapeHtml(row.date)}</span></div>
          <h2>${escapeHtml(row.role)} · ${escapeHtml(row.direction)}</h2>
          <p class="reason">${escapeHtml(row.reason)}</p>
          <div class="chips">${chips(row.tags)}</div>
          <div class="logicbox">
            <div class="logic-title">Notion 知识对应</div>
            <div class="chips">${chips(row.knowledge)}</div>
            <p><strong>开单逻辑：</strong>${escapeHtml(row.logic || '待判')}</p>
            <p><strong>条件链：</strong>${escapeHtml(row.chain || '证据链不足，需人工看图确认。')}</p>
            <p><strong>不交易过滤：</strong>${escapeHtml(row.noTrade || '无')}</p>
          </div>
          <details>
            <summary>上下文与映射依据</summary>
            <p><strong>同组文字：</strong>${escapeHtml(row.same || '无')}</p>
            <p><strong>发图前上下文：</strong>${escapeHtml(row.pre || '无')}</p>
            <p><strong>后文只作结果管理参考：</strong>${escapeHtml(row.post || '无')}</p>
            <p><strong>知识映射依据：</strong>${escapeHtml(row.basis || '无')}</p>
          </details>
        </div>
      </article>`;
    }
    function render() {
      const visible = state.filtered.slice(0, state.visibleLimit);
      $('grid').innerHTML = visible.map(card).join('');
      $('empty').hidden = state.filtered.length !== 0;
      const allChunks = state.manifest ? state.loaded.size >= state.manifest.chunks.length : false;
      $('more').disabled = state.busy || (!state.filtered.length && allChunks) || (visible.length >= state.filtered.length && allChunks);
      $('more').textContent = visible.length < state.filtered.length ? '显示更多结果' : '加载更多';
      updateStatus(`已载入索引 ${state.rows.length}/${state.manifest.total}，当前匹配 ${state.filtered.length}，正在显示 ${visible.length}`);
    }
    function updateStatus(text) { $('status').textContent = text; }
    $('more').addEventListener('click', loadNext);
    $('loadAll').addEventListener('click', loadAll);
    $('q').addEventListener('input', scheduleFilter);
    $('role').addEventListener('change', scheduleFilter);
    $('direction').addEventListener('change', scheduleFilter);
    $('logic').addEventListener('change', scheduleFilter);
    init().catch(error => {
      console.error(error);
      updateStatus('载入失败，请刷新页面重试。');
    });
  </script>
</body>
</html>
